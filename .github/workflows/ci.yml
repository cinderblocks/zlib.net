name: CI

on:
  push:
    branches: [master]
    # Releases are cut by pushing a tag such as 1.1.1 or v1.1.1.
    tags: ['v?[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # Windows additionally runs the net48 test target against the netstandard2.0 build.
      - run: dotnet test zlib.net.sln --configuration Release
      # The same tests again against the other builds: netstandard2.1 (older .NET Core and Xamarin/Unity; net8.0 test host only, since net48 cannot load it) and
      # netstandard2.0 (the one .NET Framework consumers get). The default run above uses the net8.0 build.
      - run: dotnet test tests/zlib.net.Tests --configuration Release -f net8.0 -p:LibraryTfm=netstandard2.1
      - run: dotnet test tests/zlib.net.Tests --configuration Release -p:LibraryTfm=netstandard2.0
      # The fuzz harness must keep working: replay its seed corpus through both targets (the AFL run is in fuzz.yml).
      - name: Fuzz harness smoke test
        shell: bash
        run: |
          dotnet run --project fuzz/zlib.net.Fuzz --configuration Release -- corpus fuzz/work/corpus
          dotnet run --project fuzz/zlib.net.Fuzz --configuration Release --no-build -- inflate --replay fuzz/work/corpus/inflate
          dotnet run --project fuzz/zlib.net.Fuzz --configuration Release --no-build -- roundtrip --replay fuzz/work/corpus/roundtrip

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # The csproj is the single source of the package version; a tag that disagrees with it is a mistake.
      - name: Check tag matches the project version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          project_version="$(dotnet msbuild zlib.net.csproj -getProperty:Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $project_version. Update <Version> in zlib.net.csproj first."
            exit 1
          fi
      # Package validation also checks the result against the baseline version once one is set in the csproj.
      - name: Pack
        run: dotnet pack zlib.net.csproj --configuration Release --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts
      # Exchanges the GitHub OIDC token for a short-lived nuget.org API key (needs a trusted publishing policy
      # for this repository and workflow on nuget.org).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: cinderblocks
      # The matching .snupkg symbol package is pushed automatically alongside each .nupkg.
      # No --skip-duplicate: it reports every HTTP 409 as "already exists" and hides the server's real message, and a push
      # that did not happen must fail the job before a GitHub release is created for it.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
